# A high-risk generative assistant with RAG and tool-using agent that passes every control.
apiVersion: ai-security.example/v1
kind: AISystem
metadata:
  name: support-copilot
  inventory_id: AI-0042
  owner: ml-platform@example.com
  risk_tier: high
spec:
  type: generative

  governance:
    risk_assessment:
      completed: true
    threat_model:
      completed: true
      last_reviewed: "2026-08-20"
    red_team:
      last_exercise: "2026-09-15"

  supply_chain:
    dependency_scanning: true

  model:
    source: third_party
    name: open-llm-8b-instruct
    format: safetensors
    checksum: "sha256:4f1c2e9a7b0d3e5f6a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f"
    signature_verified: true
    from_verified_repository: true
    provenance_documented: true
    scanned_for_malicious_code: true
    behavioral_validation: true

  data:
    training:            # fine-tuning set
      sources:
        - name: resolved-support-tickets
          trusted: true
          provenance_documented: true
        - name: public-product-docs
          trusted: false
          sanitized: true
          provenance_documented: true
      integrity_verification: true
      anomaly_detection: true
      encryption_at_rest: true
      access:
        least_privilege: true
        just_in_time: true
      contains_pii: true
      pii_controls:
        minimization: true
        deidentification: true
        differential_privacy: false
      retention_days: 365
    continuous_learning:
      enabled: false
    rag:
      enabled: true
      sources_vetted: true
      contains_sensitive: true
      per_document_authz: true
      encryption_at_rest: true

  inference:
    exposure: public
    authentication_required: true
    rate_limit:
      per_user: true
      requests_per_minute: 30
    returns_confidence_scores: false
    query_timeout_seconds: 30
    query_pattern_monitoring: true

  llm:
    untrusted_content_sources: [customer_email]
    prompt_injection:
      input_filtering: true
      input_segregation: true
      hardened_system_prompt: true
      adversarial_testing: true
    output:
      consumers: [browser]
      sensitive_data_filter: true
      validation_and_encoding: true

  agent:
    enabled: true
    computer_use: false
    execution_environment: sandboxed
    action_audit_log: true
    kill_switch: true
    credentials:
      identity: dedicated
      ttl_minutes: 15
    tools:
      - name: lookup_order
        action: read
        scopes: ["orders:read:own-customer"]
      - name: draft_reply
        action: write
        scopes: ["tickets:write:draft"]
        requires_human_approval: true
      - name: issue_refund
        action: payment
        scopes: ["refunds:create:max-100usd"]
        requires_human_approval: true

  operations:
    human_oversight: true
    guardrails: true
    end_of_life_disposal: true
    logging:
      enabled: true
      fields: [input, output, timestamp, user_id, model_version]
    monitoring:
      continuous_validation: true
      behavioral_baseline: true
      mitigation_regression_tests: true
    environment:
      dev_prod_separated: true
